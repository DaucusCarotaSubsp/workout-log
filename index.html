<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ワークアウト帳</title>
<meta name="description" content="種目ごとの動画を時間でつないで再生し、回数・重量・自己ベストを記録する個人用ワークアウト帳">
<meta name="theme-color" content="#f1f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1017" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ワークアウト帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* page frame (safe areas for the iPhone notch / home bar) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout concept: bottom-tab app on a cool chalk ground; one dark "stage" (the player) is where the type gets loud. */
:root{
  color-scheme:light;
  --bg:#f1f4f8; --surface:#ffffff; --surface-2:#e7ecf2; --ink:#0d1a2b; --ink-2:#47546a; --muted:#6f7c8f; --line:#dae1ea;
  --accent:#1c5cab; --accent-ink:#ffffff; --accent-soft:#dfeafa;
  --good:#0a7a0a; --danger:#c23232; --danger-soft:#fbe4e4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --other:#98a2b0;
  --grid:#e3e8ef; --axis:#c3cbd6; --track:#cde2fb; --fill:#2a78d6;
  --h0:#e7ecf2; --h1:#cde2fb; --h2:#9ec5f4; --h3:#5598e7; --h4:#1c5cab;
  --stage:#06080c; --stage-ink:#f2f5f9; --stage-dim:#9aa7b8; --stage-accent:#6da7ec;
  --font-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b1017; --surface:#141b25; --surface-2:#1d2632; --ink:#eef2f7; --ink-2:#b2bdcb; --muted:#8693a4; --line:#263140;
    --accent:#6da7ec; --accent-ink:#07111e; --accent-soft:#16283e;
    --good:#3fbf3f; --danger:#ee7070; --danger-soft:#3a1a1a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --other:#6c7787;
    --grid:#222c39; --axis:#344255; --track:#0d366b; --fill:#3987e5;
    --h0:#1d2632; --h1:#104281; --h2:#1c5cab; --h3:#3987e5; --h4:#86b6ef;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b1017; --surface:#141b25; --surface-2:#1d2632; --ink:#eef2f7; --ink-2:#b2bdcb; --muted:#8693a4; --line:#263140;
  --accent:#6da7ec; --accent-ink:#07111e; --accent-soft:#16283e;
  --good:#3fbf3f; --danger:#ee7070; --danger-soft:#3a1a1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --other:#6c7787;
  --grid:#222c39; --axis:#344255; --track:#0d366b; --fill:#3987e5;
  --h0:#1d2632; --h1:#104281; --h2:#1c5cab; --h3:#3987e5; --h4:#86b6ef;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto}
.num{font-family:var(--font-num);font-variant-numeric:lining-nums}

/* header + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:17px;font-weight:700;letter-spacing:.02em}
.glyph{display:grid;gap:3px;width:22px}
.glyph i{display:block;height:4px;border-radius:2px;background:var(--accent)}
.glyph i:nth-child(1){width:100%}.glyph i:nth-child(2){width:62%;background:var(--other)}.glyph i:nth-child(3){width:82%}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg,.tab svg,.btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:500;text-decoration:none}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:700}

/* common */
.view{padding-block:20px 8px;display:grid;gap:22px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
h2.sec{font-size:19px;font-weight:700;letter-spacing:.01em}
.sub{color:var(--ink-2);font-size:13px}
.cap{color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.empty{padding:28px 18px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:16px;display:grid;gap:12px;justify-items:center}
.banner{max-width:880px;margin:12px auto 0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:13px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--danger-soft)}
.meter{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--fill)}
.meter.good i{background:var(--good)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:500}

/* thumbnails */
.thumb{position:relative;aspect-ratio:16/10;max-width:100%;background:var(--surface-2);border-radius:12px;overflow:hidden;display:grid;place-items:center}
.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .ph{font-family:var(--font-num);font-weight:700;font-size:44px;line-height:1;color:#fff;position:absolute;inset:0;display:grid;place-items:center}
.thumb .badge{position:absolute;right:6px;bottom:6px;background:rgba(6,8,12,.72);color:#fff;font-size:11px;padding:1px 8px;border-radius:99px}
.thumb.sm{width:56px;aspect-ratio:1;flex:none;border-radius:10px}
.thumb.sm .ph{font-size:24px}

/* today */
.date-big{font-family:var(--font-num);font-weight:700;font-size:40px;line-height:1.05}
.date-big small{font-size:18px;font-weight:600;color:var(--ink-2);margin-left:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:grid;justify-items:center;gap:4px;padding:8px 0;border-radius:12px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line)}
.wd b{font-family:var(--font-num);font-size:18px;font-weight:600;color:var(--ink)}
.wd .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:transparent}
.wd.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wd .dot svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hero{display:grid;gap:12px}
.hero-num{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero-num .big{font-family:var(--font-num);font-weight:700;font-size:88px;line-height:.95;letter-spacing:-.01em}
.hero-num .unit{font-size:18px;font-weight:700;color:var(--ink-2)}
.hero-num .goal{font-size:14px;color:var(--ink-2)}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.item .t{font-weight:700}

/* exercises */
.grid-ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ex-card{display:grid;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;min-width:0}
.ex-card .name{font-weight:700;overflow-wrap:anywhere}
.ex-card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.ex-card .acts{display:flex;gap:8px}

/* workouts */
.wk-card{display:grid;gap:12px}
.wk-card .title{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.tl{display:flex;gap:2px;height:10px}
.tl i{display:block;border-radius:3px;min-width:3px}
.tl i.rest{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}

/* sheets */
.sheet-back{position:fixed;inset:0;z-index:100;background:rgba(6,10,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92dvh;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3);outline:0}
@supports (height:1dvh){.sheet{max-height:92dvh}}
.sheet.wide{max-width:760px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px max(16px,env(safe-area-inset-left,0px))}
.sheet-head h2{font-size:18px;font-weight:700}
.sheet-body{overflow:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px;align-content:start;min-height:0}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.field{display:grid;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;min-height:44px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:104px;resize:vertical;line-height:1.6}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stepper button{width:40px;height:44px;font-size:20px;color:var(--ink-2)}
.stepper button:hover{background:var(--surface-2)}
.stepper input{width:64px;border:0;border-radius:0;text-align:center;font-family:var(--font-num);font-size:22px;font-weight:600;padding:0;min-height:44px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper .u{padding:0 10px 0 2px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.vid-box{display:grid;gap:10px}
.vid-box video{width:100%;max-height:240px;border-radius:12px;background:#000}
.note{font-size:12px;color:var(--ink-2)}

/* builder */
.blk{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.blk .rest-mark{width:56px;height:56px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-family:var(--font-num);font-weight:700;font-size:15px;letter-spacing:.06em}
.blk .name{font-weight:700;overflow-wrap:anywhere}
.blk .ctl{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.blk .mv{display:flex;gap:2px}
.blk .mv button{width:36px;height:36px;border-radius:10px;color:var(--ink-2);display:grid;place-items:center}
.blk .mv button:hover{background:var(--surface-2)}
.blk .mv svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pick{display:grid;gap:6px;text-align:left;padding:6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;min-width:0}
.pick span{overflow-wrap:anywhere}
.pick:hover{border-color:var(--accent)}
.sum{display:grid;gap:8px}
.sum .tot{font-family:var(--font-num);font-size:34px;font-weight:700;line-height:1}

/* log */
.entry{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.entry .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.setbox{display:grid;gap:2px;justify-items:center}
.setbox span{font-size:11px;color:var(--muted)}
.setbox input{width:64px;text-align:center;font-family:var(--font-num);font-size:22px;font-weight:600;padding:0;min-height:44px}
.prev{font-size:12px;color:var(--ink-2)}

/* player */
.player{position:fixed;inset:0;z-index:60;background:var(--stage);color:var(--stage-ink);display:flex;flex-direction:column;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  color-scheme:dark;overflow:hidden}
.player .in{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px;flex:1 1 auto;min-height:0}
.p-top{display:flex;align-items:center;gap:10px}
.p-top .t{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-top .c{font-family:var(--font-num);font-size:20px;font-weight:600;color:var(--stage-dim)}
.pbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--stage-ink);background:rgba(255,255,255,.1)}
.pbtn:hover{background:rgba(255,255,255,.18)}
.pbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p-stage{position:relative;flex:1 1 0;min-height:140px;border-radius:18px;overflow:hidden;background:#0d1117}
.p-stage video{width:100%;height:100%;object-fit:contain;display:block}
.p-stage .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-num);font-weight:700;font-size:min(40vw,200px);color:rgba(255,255,255,.1)}
.p-big{position:absolute;left:16px;top:8px;font-family:var(--font-num);font-weight:700;font-size:clamp(72px,20vw,132px);line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.7);font-variant-numeric:lining-nums}
.p-tag{position:absolute;right:14px;top:14px;padding:4px 14px;border-radius:99px;font-family:var(--font-num);font-weight:700;font-size:20px;letter-spacing:.12em;background:rgba(6,8,12,.7)}
.p-tag.rest{background:var(--stage-accent);color:#07111e}
.p-start,.p-done{position:absolute;inset:0;background:rgba(6,8,12,.78);display:grid;place-content:center;gap:16px;text-align:center;padding:20px}
.p-start .btn,.p-done .btn{min-height:64px;font-size:20px;padding:0 36px;border-radius:99px}
.p-done .big{font-family:var(--font-num);font-size:56px;font-weight:700;line-height:1}
.p-info{display:grid;gap:4px;max-height:20vh;overflow:auto}
.p-info h2{font-size:22px;font-weight:700;overflow-wrap:anywhere}
.p-info p{color:var(--stage-dim);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.p-bars{display:grid;gap:12px}
.pb{display:grid;gap:5px}
.pb .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--stage-dim)}
.pb .lab .tm{font-family:var(--font-num);font-size:20px;font-weight:600;color:var(--stage-ink);font-variant-numeric:tabular-nums}
.pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--stage-accent);border-radius:99px}
.ptotal{display:flex;gap:2px;height:8px}
.ptotal>span{display:block;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden;min-width:3px}
.ptotal>span i{display:block;height:100%;width:0;background:var(--stage-accent)}
.ptotal>span.rest i{background:#8a97aa}
.p-ctrl{display:flex;align-items:center;justify-content:center;gap:18px}
.p-ctrl .main{width:72px;height:72px;background:var(--stage-ink);color:#06080c}
.p-ctrl .main svg{width:30px;height:30px}
.p-ctrl .main:hover{background:#fff}
.p-next{text-align:center;font-size:13px;color:var(--stage-dim);min-height:20px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.tile .l{font-size:12px;color:var(--ink-2)}
.tile .v{font-family:var(--font-num);font-size:34px;font-weight:700;line-height:1.1}
.tile .v small{font-size:14px;font-weight:600;color:var(--ink-2);margin-left:3px}
.tile .d{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink-2);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.chart-card h3{font-size:16px;font-weight:700}
.chart-host{position:relative;min-width:0}
.chart-host svg{display:block;overflow:visible}
.chart-host svg text{font-family:var(--font-body)}
.tt{position:absolute;pointer-events:none;z-index:4;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 28px rgba(8,16,32,.18);border-radius:10px;padding:8px 10px;font-size:12px;min-width:132px;display:grid;gap:3px}
.tt .h{font-weight:700;color:var(--ink);margin-bottom:2px}
.tt .r{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.tt .r b{margin-left:auto;padding-left:12px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.key{display:inline-block;width:12px;height:3px;border-radius:2px;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.legend i.ln{height:3px;width:14px;border-radius:2px}
.tbl-wrap{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);font-weight:700}
.tbl td{font-variant-numeric:tabular-nums}
.meters{display:grid;gap:12px}
.mrow{display:grid;grid-template-columns:minmax(80px,1fr) 2fr auto;gap:12px;align-items:center;font-size:13px}
.mrow .n{font-weight:700;overflow-wrap:anywhere}
.mrow .f{font-family:var(--font-num);font-size:20px;font-weight:600;min-width:52px;text-align:right}
@media (max-width:520px){.mrow{grid-template-columns:1fr auto}.mrow .meter{grid-column:1/-1;order:3}}
.heat-lbl{font-size:11px;fill:var(--muted)}
.mini-btn{font-size:12px;font-weight:700;color:var(--accent);padding:4px 8px;border-radius:8px}
.mini-btn:hover{background:var(--accent-soft)}

/* weight + PR */
.setbox .pair{display:flex;align-items:center;gap:4px}
.setbox input.kg{width:76px}
.setbox .x{color:var(--muted);font-size:13px}
.pill.pr{background:var(--accent);color:var(--accent-ink);font-weight:700}
.prs{display:grid}
.prrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 18px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
.prrow:first-child{padding-top:0}.prrow:last-child{border-bottom:0;padding-bottom:0}
.prrow .big2{font-family:var(--font-num);font-size:28px;font-weight:700;line-height:1.1;white-space:nowrap}
.prrow small{font-size:12px;color:var(--ink-2);margin-left:3px;font-weight:600;font-family:var(--font-body)}
@media (max-width:420px){.prrow{grid-template-columns:1fr 1fr}.prrow>.grow{grid-column:1/-1}}
/* goal / reminder */
.banner .row{gap:8px}
.daysel{display:flex;width:100%}.daysel button{flex:1 1 0;padding:8px 0}
/* countdown */
.p-count{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:rgba(6,8,12,.6);font-family:var(--font-num);font-weight:700;font-size:min(46vw,220px);line-height:1}
.p-count b{font-weight:700;animation:cdpop .4s ease-out}
.p-count small{display:block;margin-top:8px;font-size:18px;font-family:var(--font-body);font-weight:500;color:var(--stage-dim);letter-spacing:.1em}
@keyframes cdpop{from{transform:scale(1.3);opacity:.35}to{transform:scale(1);opacity:1}}
/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:200;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;max-width:min(92vw,520px);box-shadow:0 8px 28px rgba(0,0,0,.3)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="glyph" aria-hidden="true"><i></i><i></i><i></i></span><h1>ワークアウト帳</h1></div>
  <button class="icon-btn" id="btn-set" type="button" aria-label="設定とデータ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
</div></header>
<div id="banner"></div>
<main id="view" class="wrap" aria-live="polite"></main>
<nav class="tabs" aria-label="メイン"><div class="tabs-in">
  <a class="tab" data-v="today" href="#today"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"/></svg>今日</a>
  <a class="tab" data-v="exercises" href="#exercises"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M3 10v4M18 7v10M21 10v4M6 12h12"/></svg>種目</a>
  <a class="tab" data-v="workouts" href="#workouts"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>ワークアウト</a>
  <a class="tab" data-v="stats" href="#stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-9M12 20V5M19 20v-6"/></svg>グラフ</a>
</div></nav>
<div id="layers"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
/* ================= helpers ================= */
var DOW=['日','月','火','水','木','金','土'];
var pad=function(n){return String(n).padStart(2,'0');};
var dstr=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var parseD=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
var addDays=function(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);};
var todayS=function(){return dstr(new Date());};
var fmtT=function(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+pad(sec%60);};
var fmtDur=function(sec){sec=Math.round(sec);var m=Math.floor(sec/60),s=sec%60;return m?(s?m+'分'+s+'秒':m+'分'):s+'秒';};
var fmtMD=function(s){var d=parseD(s);return (d.getMonth()+1)+'/'+d.getDate();};
var fmtK=function(n){return n>=10000?(Math.round(n/100)/10)+'K':String(n);};
var clamp=function(v,a,b){return Math.min(b,Math.max(a,v));};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);};
var clone=function(o){return JSON.parse(JSON.stringify(o));};
var NS='http://www.w3.org/2000/svg';

function add(e,kids){for(var i=0;i<kids.length;i++){var k=kids[i];if(k==null||k===false)continue;if(Array.isArray(k))add(e,k);else e.appendChild(k.nodeType?k:document.createTextNode(String(k)));}}
function h(tag,props){
  var e=document.createElement(tag);
  if(props)for(var k in props){var v=props[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='style')e.style.cssText=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='muted'||k==='loop'||k==='playsInline')e[k]=v;
    else e.setAttribute(k,v===true?'':String(v));
  }
  add(e,Array.prototype.slice.call(arguments,2));return e;
}
function sv(tag,props){
  var e=document.createElementNS(NS,tag);
  if(props)for(var k in props){var v=props[k];if(v==null)continue;if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else e.setAttribute(k,String(v));}
  add(e,Array.prototype.slice.call(arguments,2));return e;
}
var ICONS={
  play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/>',
  pause:'<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/>',
  prev:'<path d="M6 5v14"/><path d="M19 6v12l-9-6z" fill="currentColor"/>',
  next:'<path d="M18 5v14"/><path d="M5 6v12l9-6z" fill="currentColor"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  up:'<path d="M6 14l6-6 6 6"/>',
  down:'<path d="M6 10l6 6 6-6"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  vol:'<path d="M4 10v4h4l5 4V6L8 10z" fill="currentColor"/><path d="M16.5 9a4 4 0 0 1 0 6"/>',
  mute:'<path d="M4 10v4h4l5 4V6L8 10z" fill="currentColor"/><path d="M17 9l4 6M21 9l-4 6"/>',
  bell:'<path d="M6 17h12l-2-3v-4a4 4 0 0 0-8 0v4z"/><path d="M10 20h4"/>',
  bellOff:'<path d="M6 17h12l-2-3v-4a4 4 0 0 0-8 0v4z"/><path d="M10 20h4M4 4l16 16"/>',
  log:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 11h8M8 15h5"/>',
  dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>'
};
function icon(n){var s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');s.innerHTML=ICONS[n]||'';return s;}
var pref={
  get:function(k,d){try{var v=localStorage.getItem('wo.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem('wo.'+k,JSON.stringify(v));}catch(e){}}
};

/* ================= state ================= */
var S={ex:[],wk:[],logs:[],ready:{ex:false,wk:false,logs:false},db:null,assets:null,downloads:null,owner:true,noDb:false,loadFail:false,
  view:'today',st:{range:30,by:'ex',exId:null,tbl:{}}};
var COL={exercises:'ex',workouts:'wk',logs:'logs'};
var DRAWS=[];
var P=null;           /* player state */
var stack=[];         /* open sheets */
var allReady=function(){return S.ready.ex&&S.ready.wk&&S.ready.logs;};
var rq=0;
function schedule(){if(rq)return;rq=requestAnimationFrame(function(){rq=0;render();});}

var store={
  set:async function(col,id,data){
    if(S.db){await S.db.collection(col).doc(id).set(data);return;}
    var key=COL[col],arr=S[key].slice(),i=arr.findIndex(function(x){return x.id===id;}),o=Object.assign({id:id},data);
    if(i>=0)arr[i]=o;else arr.push(o);S[key]=arr;localSave();schedule();
  },
  del:async function(col,id){
    if(S.db){await S.db.collection(col).doc(id).delete();return;}
    var key=COL[col];S[key]=S[key].filter(function(x){return x.id!==id;});localSave();schedule();
  }
};
function stripId(o){var c=Object.assign({},o);delete c.id;return c;}
function pickSlot(list){var used={};list.forEach(function(x){if(x.slot!=null)used[x.slot]=1;});for(var i=0;i<8;i++)if(!used[i])return i;return 8;}
function colorOf(slot){return slot!=null&&slot<8?'var(--s'+(slot+1)+')':'var(--other)';}

/* ================= derived data ================= */
var entryReps=function(e){return (e.sets||[]).reduce(function(a,b){return a+(+b||0);},0);};
var entryTarget=function(e){return (e.tSets||0)*(e.tReps||0);};
function sortedLogs(){return S.logs.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0);});}
function streak(){
  var set={};S.logs.forEach(function(s){set[s.date]=1;});
  var d=todayS();if(!set[d])d=addDays(d,-1);
  var n=0;while(set[d]){n++;d=addDays(d,-1);}return n;
}
function weekStart(s){var d=parseD(s);return addDays(s,-((d.getDay()+6)%7));}
function totalSec(w){return (w.blocks||[]).reduce(function(a,b){return a+(+b.sec||0);},0);}
function uniqueExIds(blocks){var seen={},out=[];(blocks||[]).forEach(function(b){if(b.type!=='rest'&&b.exId&&!seen[b.exId]){seen[b.exId]=1;out.push(b.exId);}});return out;}
function lastEntryFor(exId,skipId){
  var l=sortedLogs();
  for(var i=0;i<l.length;i++){if(l[i].id===skipId)continue;var es=l[i].entries||[];for(var j=0;j<es.length;j++)if(es[j].exId===exId)return Object.assign({_date:l[i].date},es[j]);}
  return null;
}

/* ================= video storage ================= */
var IDB={
  open:function(){return new Promise(function(res,rej){var r=indexedDB.open('workout-videos',1);r.onupgradeneeded=function(){r.result.createObjectStore('v');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});},
  put:async function(k,blob){var db=await IDB.open();return new Promise(function(res,rej){var t=db.transaction('v','readwrite');t.objectStore('v').put(blob,k);t.oncomplete=function(){res();};t.onerror=function(){rej(t.error);};});},
  get:async function(k){var db=await IDB.open();return new Promise(function(res,rej){var r=db.transaction('v').objectStore('v').get(k);r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});},
  del:async function(k){var db=await IDB.open();return new Promise(function(res){var t=db.transaction('v','readwrite');t.objectStore('v').delete(k);t.oncomplete=function(){res();};t.onerror=function(){res();};});}
};
var urlCache={};
async function videoUrl(ex){
  var v=ex&&ex.video;if(!v)return null;
  if(v.kind==='asset')return null;
  if(v.kind==='local'){
    if(urlCache[v.key])return urlCache[v.key];
    try{var b=await IDB.get(v.key);if(!b)return null;urlCache[v.key]=URL.createObjectURL(b);return urlCache[v.key];}catch(e){return null;}
  }
  return null;
}
async function storeVideo(file){
  var key='v'+uid();
  await IDB.put(key,file);
  return {video:{kind:'local',key:key,name:file.name,size:file.size},note:''};
}
async function dropVideo(v){
  if(!v)return;
  try{
    if(v.kind==='local'){await IDB.del(v.key);if(urlCache[v.key]){URL.revokeObjectURL(urlCache[v.key]);delete urlCache[v.key];}}
  }catch(e){}
}
function thumb(ex,cls){
  var box=h('div',{class:'thumb'+(cls?' '+cls:'')});
  var c=colorOf(ex&&ex.slot);
  box.style.background='color-mix(in srgb,'+c+' 22%,var(--surface-2))';
  box.appendChild(h('div',{class:'ph',style:'color:'+c},((ex&&ex.name)||'?').trim().charAt(0).toUpperCase()));
  if(ex&&ex.video){
    videoUrl(ex).then(function(u){
      if(!u||!box.isConnected&&false)return;
      var v=h('video',{muted:true,playsInline:true,preload:'metadata',src:u+'#t=0.1','aria-hidden':'true'});
      box.appendChild(v);
      if(!cls||cls.indexOf('sm')<0)box.appendChild(h('span',{class:'badge'},ex.video.kind==='local'?'この端末のみ':'動画'));
    });
  }
  return box;
}

/* ================= UI primitives ================= */
function lockScroll(){document.documentElement.style.overflow=(stack.length||P)?'hidden':'';}
function sheet(o){
  var prevFocus=document.activeElement;
  var back=h('div',{class:'sheet-back'});
  var api;
  var closeBtn=h('button',{class:'icon-btn',type:'button','aria-label':'閉じる',onclick:function(){api.close();}},icon('close'));
  var body=h('div',{class:'sheet-body'},o.body);
  var foot=o.foot&&o.foot.length?h('div',{class:'sheet-foot'},o.foot):null;
  var box=h('div',{class:'sheet'+(o.wide?' wide':''),role:'dialog','aria-modal':'true','aria-label':o.title,tabindex:'-1'},
    h('div',{class:'sheet-head'},h('h2',null,o.title),closeBtn),body,foot);
  back.appendChild(box);
  var down=null;
  back.addEventListener('pointerdown',function(e){down=e.target;});
  back.addEventListener('click',function(e){if(e.target===back&&down===back)api.close();});
  api={el:box,body:body,close:function(val){
    if(!back.isConnected)return;
    back.remove();var i=stack.indexOf(api);if(i>=0)stack.splice(i,1);lockScroll();
    if(o.onClose)o.onClose(val);
    try{if(prevFocus&&prevFocus.focus&&prevFocus.isConnected)prevFocus.focus();}catch(e){}
  }};
  stack.push(api);document.getElementById('layers').appendChild(back);lockScroll();box.focus();
  return api;
}
function ask(o){
  return new Promise(function(res){
    var done=false;var fin=function(v){if(done)return;done=true;res(v);};
    var s=sheet({title:o.title,body:[h('p',{style:'font-size:15px'},o.text)],
      foot:o.buttons.map(function(b){return h('button',{class:'btn '+(b.kind||''),type:'button',onclick:function(){fin(b.value);s.close();}},b.label);}),
      onClose:function(){fin(null);}});
  });
}
var ttimer=0;
function toast(m,ms){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(ttimer);ttimer=setTimeout(function(){t.hidden=true;},ms||3000);}
function stepper(o){
  var v=o.value;
  var rd=o.round||1;
  var inp=h('input',{type:'number',inputmode:rd<1?'decimal':'numeric',step:String(rd),min:o.min,max:o.max,value:o.value,'aria-label':o.label});
  var norm=function(x){x=Number(x);if(!isFinite(x))x=o.min;x=Math.round(Math.round(x/rd)*rd*100)/100;return clamp(x,o.min,o.max);};
  var commit=function(x){v=norm(x);inp.value=v;if(o.onChange)o.onChange(v);};
  inp.addEventListener('input',function(){if(inp.value!==''){v=norm(inp.value);if(o.onChange)o.onChange(v);}});
  inp.addEventListener('change',function(){commit(inp.value);});
  var step=o.step||1;
  var el=h('div',{class:'stepper'},
    h('button',{type:'button','aria-label':o.label+'を減らす',onclick:function(){commit(v-step);}},'−'),
    inp,o.unit?h('span',{class:'u'},o.unit):null,
    h('button',{type:'button','aria-label':o.label+'を増やす',onclick:function(){commit(v+step);}},'＋'));
  return {el:el,get:function(){return v;},set:commit};
}
function field(label,node,id){return h('div',{class:'field'},h('label',{for:id},label),node);}

/* ================= small shared UI ================= */
var exById=function(id){return S.ex.find(function(x){return x.id===id;})||null;};
var wkById=function(id){return S.wk.find(function(x){return x.id===id;})||null;};
function meter(pct,extra){
  var p=clamp(Math.round(pct)||0,0,100);
  return h('div',{class:'meter'+(pct>=100&&extra!=='plain'?' good':''),role:'progressbar','aria-valuemin':'0','aria-valuemax':'100','aria-valuenow':String(p)},h('i',{style:'width:'+p+'%'}));
}
function emptyBlock(text,label,fn){
  return h('div',{class:'empty'},h('p',null,text),label?h('button',{class:'btn primary',type:'button',onclick:fn},icon('plus'),label):null);
}
function secHead(title,btn){return h('div',{class:'sec-head'},h('h2',{class:'sec'},title),btn||null);}
async function safe(fn,msg){try{await fn();return true;}catch(e){toast(msg||'保存できませんでした。もう一度お試しください。');return false;}}
function wMode(ex){return (ex&&ex.weightMode)||((ex&&ex.useWeight)?'ext':'off');}
function entryFrom(ex){
  var e={exId:ex.id,name:ex.name,tSets:ex.tSets,tReps:ex.tReps,sets:Array(ex.tSets).fill(ex.tReps)};
  var m=wMode(ex);
  if(m!=='off'){e.w=Array(ex.tSets).fill(ex.tWeight||0);if(m==='bw')e.bw=true;}
  return e;
}
function fmtPR(p,bw){return bw?((p.w>0?'+'+fmtKg(p.w)+'kg':'自重')+' × '+p.wReps+'回'):(fmtKg(p.w)+'kg × '+p.wReps+'回');}
function exWeightText(ex){var m=wMode(ex);if(m==='ext')return ' ・ '+(ex.tWeight?fmtKg(ex.tWeight)+'kg':'重量記録');if(m==='bw')return ' ・ 自重'+(ex.tWeight?'＋'+fmtKg(ex.tWeight)+'kg':'＋加重');return '';}
/* weekly goal helpers */
function cfg(){var p=S.profileData||{};return {weeklyGoal:clamp(parseInt(p.weeklyGoal,10)||3,1,7),remindOn:!!p.remindOn,remindTime:p.remindTime||'20:00',remindDays:Array.isArray(p.remindDays)?p.remindDays:[0,1,2,3,4,5,6],backupEvery:(p.backupEvery==null?7:(+p.backupEvery||0))};}
function daySet(){var o={};S.logs.forEach(function(l){o[l.date]=1;});return o;}
function weekCount(have,ws){var n=0;for(var i=0;i<7;i++)if(have[addDays(ws,i)])n++;return n;}
function weeksStreak(have,goal){
  var ws=weekStart(todayS()),n=0;
  if(weekCount(have,ws)>=goal)n++;
  ws=addDays(ws,-7);
  for(var k=0;k<104;k++){if(weekCount(have,ws)>=goal){n++;ws=addDays(ws,-7);}else break;}
  return n;
}
function goalCard(have,ws){
  var goal=cfg().weeklyGoal,done=weekCount(have,ws),ok=done>=goal,st=weeksStreak(have,goal);
  return h('section',{class:'card hero'},
    h('div',{class:'sec-head'},h('div',{class:'sub'},'今週の目標'),st>1?h('span',{class:'pill'},'達成 '+st+'週連続'):null),
    h('div',{class:'hero-num'},h('span',{class:'big',style:'font-size:56px'},done),h('span',{class:'unit'},'/ '+goal+'日'),h('span',{class:'goal'},ok?'今週の目標を達成しました':'あと'+(goal-done)+'日')),
    meter(done/goal*100),
    h('div',{class:'row'},h('button',{class:'btn ghost sm',type:'button',onclick:function(){openSettings();}},'目標・リマインドを変える')));
}
function reminderDue(){
  var c=cfg();if(!c.remindOn)return null;
  var now=new Date();if(c.remindDays.indexOf(now.getDay())<0)return null;
  if(pad(now.getHours())+':'+pad(now.getMinutes())<c.remindTime)return null;
  var t=todayS();if(S.logs.some(function(l){return l.date===t;}))return null;
  if(pref.get('remDis','')===t)return null;
  var left=c.weeklyGoal-weekCount(daySet(),weekStart(t));
  return '今日のトレーニングがまだです。'+(left>0?'今週の目標まであと'+left+'日です。':'');
}
function fmtKg(n){return String(Math.round(n*10)/10);}
function setsText(e){return (e.sets||[]).map(function(r,i){var w=e.w&&e.w[i];return (w?fmtKg(w)+'kg×':'')+r;}).join(' / ');}
function e1rm(w,r){return w*(1+r/30);}
function bestOf(e){
  var b={w:0,wReps:0,e1:0,vol:0,maxR:0};
  (e.sets||[]).forEach(function(r,i){
    var w=(e.w&&e.w[i])||0;
    if(r>0&&(w>0||e.bw)){
      if(w>b.w||(w===b.w&&r>b.wReps)){b.w=w;b.wReps=r;}
      b.maxR=Math.max(b.maxR,r);
      if(!e.bw)b.e1=Math.max(b.e1,e1rm(w,r));
      b.vol+=w*r;
    }
  });
  return b;
}
function prFor(exId,opt){
  opt=opt||{};var best={w:0,wReps:0,wDate:'',e1:0,e1Date:'',maxR:0,n:0};
  S.logs.forEach(function(l){
    if(opt.excludeId&&l.id===opt.excludeId)return;
    if(opt.before&&!(l.date<opt.before.date||(l.date===opt.before.date&&(l.ts||0)<(opt.before.ts||0))))return;
    (l.entries||[]).forEach(function(e){
      if(e.exId!==exId||!e.w)return;var b=bestOf(e);if(!b.w&&!b.wReps)return;best.n++;if(b.maxR>best.maxR)best.maxR=b.maxR;
      if(b.w>best.w||(b.w===best.w&&b.wReps>best.wReps)){best.w=b.w;best.wReps=b.wReps;best.wDate=l.date;}
      if(b.e1>best.e1){best.e1=b.e1;best.e1Date=l.date;}
    });
  });
  return best;
}
function prKinds(e,prior){
  if(!prior||!prior.n)return [];var b=bestOf(e),k=[];
  if(!b.w&&!b.wReps)return [];
  if(e.bw){if(b.w>prior.w)k.push('最大加重');else if(b.w===prior.w&&b.wReps>prior.wReps)k.push('回数');return k;}
  if(b.w>prior.w)k.push('最大重量');
  if(b.e1>prior.e1+0.05)k.push('推定1RM');
  return k;
}
function prLine(ex){var p=prFor(ex.id);return h('div',{class:'cap'},p.n?'自己ベスト '+fmtPR(p,wMode(ex)==='bw'):'重量の記録はまだありません');}

      await store.del('exercises',d.id);
    },'削除できませんでした。');
    if(done){await dropVideo(d.video);s.close();toast('削除しました');}
  }

var audioCtx=null,wakeLock=null;
function beep(freq,ms){
  if(!pref.get('sound',true)||!audioCtx)return;
  if(audioCtx.state==='suspended'){try{audioCtx.resume();}catch(e){}}
  try{
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=freq;o.type='sine';g.gain.value=.0001;
    o.connect(g);g.connect(audioCtx.destination);
    var t=audioCtx.currentTime;g.gain.exponentialRampToValueAtTime(.25,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+ms/1000);
    o.start(t);o.stop(t+ms/1000+.02);
  }catch(e){}
}

  var urls=await Promise.all(seq.map(function(b,i){
    var ex=b.ex;
    if(!ex){for(var j=i+1;j<seq.length;j++)if(seq[j].ex){ex=seq[j].ex;break;}}
    return videoUrl(ex);
  }));
  var cum=[0];seq.forEach(function(b){cum.push(cum[cum.length-1]+b.sec);});
  P={w:w,seq:seq,urls:urls,cum:cum,total:cum[cum.length-1],i:0,t:0,running:false,last:0,active:0,started:false,finished:false,lastBeep:-1,timer:0};

function niceScale(v){
  if(v<=0)return {max:4,step:1};
  var raw=v/4,p=Math.pow(10,Math.floor(Math.log10(raw))),c=[1,2,5,10],step=p*10;
  for(var i=0;i<c.length;i++){if(c[i]*p>=raw){step=c[i]*p;break;}}
  step=Math.max(1,step);
  return {max:Math.ceil(v/step)*step,step:step};
}
function barPath(x,y,w,hh,r){

/* ---- backup files ---- */
function backupName(){return 'WorkOut_'+todayS().replace(/-/g,'')+'.json';}
function backupPayload(){
  var c=cfg();
  return JSON.stringify({app:'workout-log',version:2,exported:new Date().toISOString(),
    settings:{weeklyGoal:c.weeklyGoal,remindOn:c.remindOn,remindTime:c.remindTime,remindDays:c.remindDays,backupEvery:c.backupEvery},
    exercises:S.ex,workouts:S.wk,logs:S.logs},null,1);
}
function markBackup(){setCfg({lastBackup:todayS(),lastBackupAt:Date.now()});}
function backupDue(){
  var c=cfg();if(!c.backupEvery)return null;
  var p=S.profileData||{},last=p.lastBackupAt||0;
  var real=S.logs.filter(function(l){return !l.sample;});
  var changed=real.some(function(l){return (l.ts||0)>last;})||S.ex.concat(S.wk).some(function(x){return !x.sample&&(x.created||0)>last;});
  if(!changed)return null;
  if(!last&&real.length<3)return null;
  var days=(Date.now()-last)/86400000;
  if(last&&days<c.backupEvery)return null;
  if(pref.get('bkDis','')===todayS())return null;
  return last?'前回のバックアップから'+Math.floor(days)+'日たち、その後の記録が増えています。':'まだバックアップを書き出していません。';
}
function isTouchApple(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function isStandalone(){return window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);}
function downloadFile(name,text){
  var url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  var a=h('a',{href:url,download:name,style:'display:none'});
  document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(url);},30000);
}
async function exportData(){
  var text=backupPayload(),name=backupName();
  /* desktop browsers with a save dialog: choose the folder */
  if(window.showSaveFilePicker){
    try{
      var fh=await window.showSaveFilePicker({suggestedName:name,types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      var wr=await fh.createWritable();await wr.write(text);await wr.close();
      markBackup();toast('「'+fh.name+'」に保存しました');return;
    }catch(e){if(e&&e.name==='AbortError')return;}
  }
  /* iPhone / iPad: the share sheet can save to Files (any folder, iCloud Drive) */
  if(isTouchApple()&&navigator.canShare&&navigator.share){
    var types=['application/json','text/plain'];
    for(var i=0;i<types.length;i++){
      try{
        var file=new File([text],name,{type:types[i]});
        if(!navigator.canShare({files:[file]}))continue;
        await navigator.share({files:[file],title:name});
        markBackup();toast('バックアップを書き出しました');return;
      }catch(e){if(e&&e.name==='AbortError')return;}
    }
  }
  downloadFile(name,text);markBackup();toast('「'+name+'」をダウンロードしました');
}
async function importBackup(f){
  try{
    var j=JSON.parse(await f.text());
    if(!j||!Array.isArray(j.exercises)||!Array.isArray(j.workouts)||!Array.isArray(j.logs))throw new Error('format');
    var ok=await ask({title:'バックアップを読み込む',text:'種目'+j.exercises.length+'件・ワークアウト'+j.workouts.length+'件・記録'+j.logs.length+'件を追加します。同じIDのデータは上書きされます。動画ファイルは含まれません。',buttons:[{label:'やめる',value:false},{label:'読み込む',value:true,kind:'primary'}]});
    if(!ok)return;
    toast('読み込み中…');
    var cols=[['exercises',j.exercises],['workouts',j.workouts],['logs',j.logs]];
    for(var c=0;c<cols.length;c++){var arr=cols[c][1];for(var i=0;i<arr.length;i++){var o=arr[i];if(!o||!o.id)continue;await store.set(cols[c][0],String(o.id),stripId(o));}}
    if(j.settings&&typeof j.settings==='object'){
      var st={};['weeklyGoal','remindOn','remindTime','remindDays','backupEvery'].forEach(function(k){if(j.settings[k]!==undefined)st[k]=j.settings[k];});
      setCfg(st);
    }
    toast('読み込みました');
  }catch(e){toast('読み込めませんでした。このアプリのバックアップファイルを選んでください。');}
}
function pickBackup(){

  var logs=days.map(function(i,k){

    return {id:'sample-blog-'+i,date:d,ts:parseD(d).getTime()+3600000*18,workoutId:null,workoutName:'',dur:0,sample:true,
      entries:[{exId:ex.id,name:ex.name,tSets:3,tReps:6,sets:R[k].slice(),w:[W[k],W[k],W[k]],bw:true}]};
  });
  return {ex:[ex],wk:[],logs:logs};
}
async function addBwSample(){
  var set=bwSample(pickSlot(S.ex));
  var ok=await safe(async function(){
    for(var i=0;i<set.ex.length;i++)await store.set('exercises',set.ex[i].id,stripId(set.ex[i]));
    for(i=0;i<set.logs.length;i++)await store.set('logs',set.logs[i].id,stripId(set.logs[i]));
  },'追加できませんでした。');
  if(ok){stack.slice().forEach(function(x){x.close();});location.hash='#stats';toast('自重＋加重のサンプルを追加しました（グラフ画面）');}
}
async function addWeightSample(){
  var set=weightSample(pickSlot(S.ex),pickSlot(S.wk));
  var ok=await safe(async function(){
    for(var i=0;i<set.ex.length;i++)await store.set('exercises',set.ex[i].id,stripId(set.ex[i]));
    for(i=0;i<set.wk.length;i++)await store.set('workouts',set.wk[i].id,stripId(set.wk[i]));
    for(i=0;i<set.logs.length;i++)await store.set('logs',set.logs[i].id,stripId(set.logs[i]));
  },'追加できませんでした。');
  if(ok){stack.slice().forEach(function(x){x.close();});location.hash='#stats';toast('重量記録のサンプルを追加しました（グラフ画面）');}
}
var seeding=false;
async function maybeSeed(){
  if(seeding||!allReady()||S.profileSeeded||S.ex.length||S.wk.length||S.logs.length)return;
  seeding=true;
  try{
    var set=sampleSet();
    S.profileData=Object.assign({},S.profileData||{},{seeded:true,created:Date.now()});if(S.db)await S.db.set(S.profileData);
    S.profileSeeded=true;
    for(var i=0;i<set.ex.length;i++)await store.set('exercises',set.ex[i].id,stripId(set.ex[i]));
    for(i=0;i<set.wk.length;i++)await store.set('workouts',set.wk[i].id,stripId(set.wk[i]));
    for(i=0;i<set.logs.length;i++)await store.set('logs',set.logs[i].id,stripId(set.logs[i]));
  }catch(e){console.error(e);}
  seeding=false;
}

/* ================= Render & boot ================= */
var VIEWS={today:vToday,exercises:vExercises,workouts:vWorkouts,stats:vStats};
function renderBanner(){
  var b=document.getElementById('banner');b.innerHTML='';
  var hasSample=[].concat(S.ex,S.wk,S.logs).some(function(x){return x.sample;});
  if(!S.localOk)b.appendChild(h('div',{class:'banner warn'},h('span',null,'このブラウザでは記録を保存できません（プライベートブラウズなど）。通常のタブで開いてください。')));
  if(isTouchApple()&&!isStandalone()&&pref.get('a2hsDis',false)!==true)b.appendChild(h('div',{class:'banner'},h('span',null,'共有ボタンから「ホーム画面に追加」すると、アプリとして使え、記録も消えにくくなります。'),h('button',{class:'btn sm',type:'button',onclick:function(){pref.set('a2hsDis',true);renderBanner();}},'閉じる')));
  else if(S.loadFail&&!allReady())b.appendChild(h('div',{class:'banner warn'},h('span',null,'データを読み込めません。接続を確認してください。つながると自動で表示されます。')));
  var bd=backupDue();
  if(bd)b.appendChild(h('div',{class:'banner'},h('span',null,bd),
    h('span',{class:'row'},h('button',{class:'btn sm primary',type:'button',onclick:function(){exportData();}},icon('dl'),'書き出す'),
      h('button',{class:'btn sm',type:'button',onclick:function(){pref.set('bkDis',todayS());renderBanner();}},'あとで'))));
  var rd=reminderDue();
  if(rd)b.appendChild(h('div',{class:'banner'},h('span',null,rd),
    h('span',{class:'row'},h('button',{class:'btn sm primary',type:'button',onclick:function(){openLog({date:todayS()});}},'記録をつける'),
      h('button',{class:'btn sm',type:'button',onclick:function(){pref.set('remDis',todayS());renderBanner();}},'今日はやらない'))));
  if(hasSample)b.appendChild(h('div',{class:'banner'},h('span',null,'サンプルデータを表示しています。自由に編集して試せます。'),h('span',{class:'row'},h('button',{class:'btn sm',type:'button',onclick:pickBackup},'バックアップを読み込む'),h('button',{class:'btn sm',type:'button',onclick:removeSamples},'サンプルを消す'))));
}
function render(){
  DRAWS=[];
  var name=(location.hash||'#today').slice(1);if(!VIEWS[name])name='today';S.view=name;
  document.querySelectorAll('.tab').forEach(function(a){if(a.getAttribute('data-v')===name)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  renderBanner();
  var host=document.getElementById('view'),y=window.scrollY;
  host.innerHTML='';
  if(!allReady())host.appendChild(h('div',{class:'view'},h('div',{class:'empty'},S.loadFail?'データを読み込めません。':'読み込み中…')));
  else{try{host.appendChild(VIEWS[name]());}catch(e){console.error(e);host.appendChild(h('div',{class:'view'},h('div',{class:'empty'},'表示でエラーが起きました。ページを開き直してください。')));}}
  window.scrollTo(0,y);
  requestAnimationFrame(drawCharts);
}
async function init(){
  S.st.range=pref.get('range',30);S.st.by=pref.get('by','ex');S.st.exId=pref.get('exId',null);S.st.wExId=pref.get('wExId',null);
  S.noDb=true;S.localOk=lsTest();localLoad();
  S.ready={ex:true,wk:true,logs:true,pf:true};
  render();maybeSeed();
}
var allReadyOrig=allReady;
allReady=function(){return S.ready.ex&&S.ready.wk&&S.ready.logs&&(S.ready.pf!==false);};
document.getElementById('btn-set').addEventListener('click',openSettings);
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});
var rz=0;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(drawCharts,120);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!P&&stack.length)stack[stack.length-1].close();});
S.ready.pf=true;
setInterval(function(){if(allReady())renderBanner();},60000);
init();
})();
